<text x="460.0" y="143.2" font-size="11" text-anchor="middle" fill="#1f2328">x_zf = Σ S*·F⁻¹y / Σ|S|²</text>
<text x="460.0" y="158.2" font-size="11" text-anchor="middle" fill="#1f2328">256 × 256, complex</text>
