<text x="640.0" y="158.2" font-size="11" text-anchor="middle" fill="#1f2328">Re and Im separately</text>
<rect x="740" y="110" width="160" height="58" rx="4" fill="#dbe7f3" stroke="#3b6ea5" stroke-width="1.1"/>
<text x="820.0" y="128.2" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">GPT-L body + heads</text>
<text x="820.0" y="143.2" font-size="11" text-anchor="middle" fill="#1f2328">Panels C, D</text>
<text x="820.0" y="158.2" font-size="11" text-anchor="middle" fill="#1f2328">426 M, trainable</text>
