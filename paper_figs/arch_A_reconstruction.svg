<text x="280.0" y="143.2" font-size="11" text-anchor="middle" fill="#1f2328">U-Net on the ACS lines</text>
<text x="280.0" y="158.2" font-size="11" text-anchor="middle" fill="#1f2328">→ maps S</text>
