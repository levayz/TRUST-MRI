<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 360" width="1320" height="360" font-family="'IBM Plex Sans', system-ui, sans-serif" style="background:#fbfaf7;color:#1f2328">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7075"/></marker></defs>
<rect x="20" y="110" width="160" height="58" rx="4" fill="#fbfaf7" stroke="#1f2328" stroke-width="1.1"/>
<text x="100.0" y="128.2" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">undersampled k-space</text>
<text x="100.0" y="143.2" font-size="11" text-anchor="middle" fill="#1f2328">y, C coils, mask M</text>
<text x="100.0" y="158.2" font-size="11" text-anchor="middle" fill="#1f2328">R = 8, 10 ACS lines</text>
