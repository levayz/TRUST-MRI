<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 340" width="1320" height="340" font-family="'IBM Plex Sans', system-ui, sans-serif" style="background:#fbfaf7;color:#1f2328">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7075"/></marker></defs>
<rect x="20" y="95" width="120" height="54" rx="4" fill="#fbfaf7" stroke="#1f2328" stroke-width="1.1"/>
<text x="80.0" y="118.7" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">complex image x</text>
<text x="80.0" y="133.7" font-size="11" text-anchor="middle" fill="#1f2328">512², ÷ max|x₀|</text>
<rect x="190" y="40" width="130" height="44" rx="4" fill="#fbfaf7" stroke="#1f2328" stroke-width="1.1"/>
<text x="255.0" y="58.7" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">Re(x)</text>
<text x="255.0" y="73.7" font-size="11" text-anchor="middle" fill="#1f2328">grayscale, 3× replicated</text>
<rect x="190" y="150" width="130" height="44" rx="4" fill="#fbfaf7" stroke="#1f2328" stroke-width="1.1"/>
<text x="255.0" y="168.7" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">Im(x)</text>
<text x="255.0" y="183.7" font-size="11" text-anchor="middle" fill="#1f2328">grayscale, 3× replicated</text>
<rect x="370" y="95" width="150" height="54" rx="4" fill="#e9e8e4" stroke="#8a8f94" stroke-width="1.1"/>
<text x="445.0" y="111.2" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">ViTamin encoder</text>
<text x="445.0" y="126.2" font-size="11" text-anchor="middle" fill="#1f2328">patch 16, shared weights</text>
<text x="445.0" y="141.2" font-size="11" text-anchor="middle" fill="#1f2328">both streams</text>
<rect x="560" y="95" width="150" height="54" rx="4" fill="#e9e8e4" stroke="#8a8f94" stroke-width="1.1"/>
<text x="635.0" y="111.2" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">quant_proj → z</text>
<text x="635.0" y="126.2" font-size="11" text-anchor="middle" fill="#1f2328">1024 positions × 64-d</text>
<text x="635.0" y="141.2" font-size="11" text-anchor="middle" fill="#1f2328">(8 unit-norm 8-d chunks)</text>
<rect x="760" y="95" width="170" height="54" rx="4" fill="#e9e8e4" stroke="#8a8f94" stroke-width="1.1"/>
<text x="845.0" y="111.2" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">product quantiser</text>
<text x="845.0" y="126.2" font-size="11" text-anchor="middle" fill="#1f2328">chunk k → nearest of 4096</text>
<text x="845.0" y="141.2" font-size="11" text-anchor="middle" fill="#1f2328">rows of codebook k</text>
<rect x="980" y="95" width="130" height="54" rx="4" fill="#fbfaf7" stroke="#1f2328" stroke-width="1.1"/>
<text x="1045.0" y="111.2" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">token IDs</text>
<text x="1045.0" y="126.2" font-size="11" text-anchor="middle" fill="#1f2328">8 per stream</text>
<text x="1045.0" y="141.2" font-size="11" text-anchor="middle" fill="#1f2328">per position</text>
