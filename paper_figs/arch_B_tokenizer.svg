<line x1="930" y1="122" x2="980" y2="122" stroke="#1f2328" stroke-width="1.1" marker-end="url(#ah)"/>
<line x1="1110" y1="122" x2="1160" y2="122" stroke="#1f2328" stroke-width="1.1" marker-end="url(#ah)"/>
<rect x="1182.0" y="108.0" width="79.9" height="15" fill="#fbfaf7"/><text x="1185" y="118" font-size="11" text-anchor="start" fill="#1f2328">v1 GPT input</text>
<text x="1185" y="134" font-size="10.5" text-anchor="start" fill="#6b7075">(token lookup)</text>
<rect x="980" y="230" width="130" height="54" rx="4" fill="#e9e8e4" stroke="#8a8f94" stroke-width="1.1"/>
<text x="1045.0" y="253.7" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">codebook rows</text>
<text x="1045.0" y="268.7" font-size="11" text-anchor="middle" fill="#1f2328">idx → f (64-d)</text>
<rect x="760" y="230" width="170" height="54" rx="4" fill="#e9e8e4" stroke="#8a8f94" stroke-width="1.1"/>
<text x="845.0" y="246.2" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">post_quant_proj →</text>
<text x="845.0" y="261.2" font-size="11" text-anchor="middle" fill="#1f2328">ViTamin decoder</text>
<text x="845.0" y="276.2" font-size="11" text-anchor="middle" fill="#1f2328">→ grayscale, clamp</text>
<rect x="560" y="230" width="150" height="54" rx="4" fill="#fbfaf7" stroke="#1f2328" stroke-width="1.1"/>
<text x="635.0" y="253.7" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="600">Re, Im decoded</text>
<text x="635.0" y="268.7" font-size="11" text-anchor="middle" fill="#1f2328">separately → complex x̂</text>
<line x1="1045" y1="149" x2="1045" y2="230" stroke="#1f2328" stroke-width="1.1" marker-end="url(#ah)"/>
<line x1="980" y1="257" x2="930" y2="257" stroke="#1f2328" stroke-width="1.1" marker-end="url(#ah)"/>
<rect x="948.9" y="241.0" width="12.2" height="15" fill="#fbfaf7"/><text x="955.0" y="251.0" font-size="11" text-anchor="middle" fill="#1f2328">f</text>
<line x1="760" y1="257" x2="710" y2="257" stroke="#1f2328" stroke-width="1.1" marker-end="url(#ah)"/>
<line x1="560" y1="257" x2="500" y2="257" stroke="#1f2328" stroke-width="1.1" marker-end="url(#ah)"/>
<rect x="510.8" y="242.0" width="18.3" height="15" fill="#fbfaf7"/><text x="520" y="252" font-size="11" text-anchor="middle" fill="#1f2328">x̂</text>
<polyline points="635,149 635,190 1180,190 1180,60" fill="none" stroke="#6b7075" stroke-width="1.1" marker-end="url(#ahm)"/>
<rect x="783.0" y="175.0" width="233.9" height="15" fill="#fbfaf7"/><text x="900" y="185" font-size="11" text-anchor="middle" fill="#1f2328">v2.1 GPT input: z, quantiser bypassed</text>
<text x="1185" y="64" font-size="10.5" text-anchor="start" fill="#6b7075">→ Panel C</text>
<line x1="845" y1="316" x2="845" y2="284" stroke="#6b7075" stroke-width="1.1" marker-end="url(#ahm)"/>
<text x="845" y="330" font-size="11" text-anchor="middle" fill="#6b7075" font-style="italic">latent path: ẑ from the latent head enters the decoder here, no quantiser (Panel D)</text>
</svg>